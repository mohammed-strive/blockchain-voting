version: '3.9'

services:
  voting-backend:
    build: .
    ports:
      - "8000:8000"
      - "8545:8545"
    environment:
      - RPC_URL=http://localhost:8545
      - WALLET_ADDRESS=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266  # Anvil account #1
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80  # Anvil private key #1
    volumes:
      - .:/app
      - ./build:/app/build
    command: task dev  # Anvil + FastAPI

  # Optional: External PostgreSQL for production-like caching
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: voting
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_
